{% extends "base.html" %}

{% block title %}Edit Package {{ package['tracking_number'] }} - MailroomOS{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <div class="flex items-center gap-2 text-xs text-slate-500 mb-1">
        <a href="{{ url_for('dashboard') }}" class="hover:text-indigo-600">Dashboard</a>
        <span>/</span>
        <a href="{{ url_for('package_detail', package_id=package['id']) }}" class="hover:text-indigo-600 font-mono">{{ package['tracking_number'] }}</a>
        <span>/</span>
        <span class="text-slate-800 font-semibold">Edit</span>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Edit Package Details</h1>
    </div>

    <!-- Delete Button -->
    <form action="{{ url_for('delete_package', package_id=package['id']) }}" method="POST"
          onsubmit="return confirm('Are you sure you want to delete this package from records? This action cannot be undone.');">
      <button type="submit" class="px-3.5 py-1.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-semibold flex items-center gap-1.5 transition-colors">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span>Delete Package</span>
      </button>
    </form>
  </div>

  <div class="bg-white rounded-3xl border border-slate-200 shadow-soft p-6 sm:p-8">
    <form method="POST" action="{{ url_for('edit_package', package_id=package['id']) }}" class="space-y-4">
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Courier Carrier</label>
          <input type="text" name="courier_name" value="{{ package['courier_name'] }}" required
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Status</label>
          <select name="status" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="Ready for Pickup" {{ 'selected' if package['status'] == 'Ready for Pickup' }}>Ready for Pickup</option>
            <option value="Collected" {{ 'selected' if package['status'] == 'Collected' }}>Collected</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Recipient Name *</label>
          <input type="text" name="recipient_name" value="{{ package['recipient_name'] }}" required
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Destination Unit / Flat *</label>
          <input type="text" name="recipient_unit" value="{{ package['recipient_unit'] }}" required
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
          <input type="text" name="recipient_phone" value="{{ package['recipient_phone'] or '' }}"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" name="recipient_email" value="{{ package['recipient_email'] or '' }}"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Storage Bin *</label>
          <select name="storage_bin" required
                  class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono font-bold text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
            {% for b in storage_bins %}
              <option value="{{ b['bin_code'] }}" {{ 'selected' if package['storage_bin'] == b['bin_code'] }}>
                {{ b['bin_code'] }} &mdash; {{ b['zone'] }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Classification</label>
          <select name="package_type" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
            <option value="Box" {{ 'selected' if package['package_type'] == 'Box' }}>Box</option>
            <option value="Envelope" {{ 'selected' if package['package_type'] == 'Envelope' }}>Envelope</option>
            <option value="Fragile" {{ 'selected' if package['package_type'] == 'Fragile' }}>Fragile</option>
            <option value="Perishable" {{ 'selected' if package['package_type'] == 'Perishable' }}>Perishable</option>
            <option value="Heavy" {{ 'selected' if package['package_type'] == 'Heavy' }}>Heavy</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Weight</label>
          <input type="text" name="weight" value="{{ package['weight'] or '' }}"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Special Notes</label>
        <textarea name="recipient_notes" rows="2"
                  class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500">{{ package['recipient_notes'] or '' }}</textarea>
      </div>

      <div class="pt-4 flex items-center justify-end gap-3 border-t border-slate-100">
        <a href="{{ url_for('package_detail', package_id=package['id']) }}" class="px-4 py-2 border border-slate-200 text-xs font-semibold rounded-xl text-slate-600 hover:bg-slate-50">
          Cancel
        </a>
        <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-md shadow-indigo-200">
          Save Changes
        </button>
      </div>

    </form>
  </div>

</div>
{% endblock %}
