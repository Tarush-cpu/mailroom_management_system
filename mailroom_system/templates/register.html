{% extends "base.html" %}

{% block title %}Register Resident Account - MailroomOS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
  <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-8 sm:p-10">
    
    <div class="text-center max-w-sm mx-auto">
      <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center mx-auto mb-3">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Create Resident Account</h2>
      <p class="text-xs text-slate-500 mt-1">Receive automated updates and digital pickup passes whenever mail arrives for your flat or office.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}" class="mt-8 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name *</label>
          <input type="text" name="full_name" required placeholder="e.g. Jessica Taylor"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Username *</label>
          <input type="text" name="username" required placeholder="e.g. jessica_t"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address *</label>
          <input type="email" name="email" required placeholder="jessica@example.com"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone Number</label>
          <input type="tel" name="phone" placeholder="+1 (555) 019-2834"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Unit / Flat / Suite *</label>
          <input type="text" name="unit_or_dept" required placeholder="e.g. Unit 502, Tower B"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Account Role</label>
          <select name="role" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
            <option value="resident">Resident / Recipient</option>
            <option value="staff">Mailroom Staff / Desk Attendant</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password *</label>
          <input type="password" name="password" required placeholder="At least 6 characters"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm Password *</label>
          <input type="password" name="confirm_password" required placeholder="Repeat password"
                 class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500 transition-all">
        </div>
      </div>

      <div class="pt-4">
        <button type="submit"
                class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition-all shadow-md shadow-indigo-200 flex items-center justify-center gap-2">
          <span>Complete Registration</span>
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
      </div>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
      <span>Already have an account?</span>
      <a href="{{ url_for('login') }}" class="font-semibold text-indigo-600 hover:underline ml-1">Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
